<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8">
        <title>Календарь</title>
    </head>
    <body>
        <script>
            let day_amount = 0;
            let month = parseInt(prompt('Введите номер месяца для отображения календаря', 1), 10);
            if (month < 1 || month > 12 || Number.isNaN(month))
            {
                alert("Неправильно введен номер месяца");
            }
            else if (month === 2)
            {
                day_amount = 28;
            }
            else if (month === 1 || month == 3 || month === 5 || month === 7 || month === 8 || month === 10 || month === 12)
            {
                day_amount = 31;
            }
            else
            {
                day_amount = 30;
            }
            if (day_amount !== 0)
            {
                let table = document.createElement('table');
                table.border = 1;
                table.cellSpacing = 0;
                let cur_day = 1;
                for (let i = 0; i < 5; i++)
                {
                    let tr = document.createElement('tr');
                    for (let j = 0; j < 7; j++)
                    {
                        if (day_amount-- === 0)
                            break;
                        let td = document.createElement('td');
                        td.textContent = cur_day++;
                        td.style.padding = '5px 5px';
                        td.style.textAlign = 'center';
                        tr.append(td);
                    }
                    table.append(tr);
                }
                document.body.append(table);
            }
        </script>
    </body>
</html>
