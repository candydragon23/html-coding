<body>
    <script>
        let n = parseInt(prompt('¬ведите число n')), count1 = 0, current = 1;
        while (current <= n) {
            if ((n & current) > 0) {
                count1++;
            }
            if (count1 > 1) {
                break;
            }
            current <<= 1;
        }
        if (count1 == 1) {
            console.log('YES');
        }
        else {
            console.log('NO');
        }
    </script>
</body>
