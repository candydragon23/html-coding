<body>
    <script>
        let str = prompt('Введите строку для преобразования'), ans = "", result = str.split("-");
        ans += result[0];
        for (let i = 1; i < result.length; i++) {
            result[i] = result[i].replace(result[i].charAt(0), result[i].charAt(0).toUpperCase());
            ans += result[i];
        }
        console.log(ans);
    </script>
</body>
