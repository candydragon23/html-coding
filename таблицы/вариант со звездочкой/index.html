<html>
<head>
    <title>Вариант со звездочкой</title>
    <link href="./style/style.css"
          rel="stylesheet"
          type="text/css" />
</head>
<body>
    <table>
        <tr class="border">
            <th colspan="3">Личный зачёт кубка мира</th>
        </tr>
        <tr class="border">
            <td class="smallcol secrow number">№</td>
            <td class="secrow">Спортсмен</td>
            <td class="smallcol secrow points">Очки</td>
        </tr>
        <tr class="border">
            <td class="smallcol green">1.</td>
            <td class="green tooltip">Мартен Фуркад <span class="tooltiptext">Франция</span></td>
            <td class="smallcol bold green middle changecolor">151</td>
        </tr>
        <tr class="border">
            <td class="smallcol red">2.</td>
            <td class="red tooltip">Эмиль-Хегле Свендсен <span class="tooltiptext">Норвегия</span></td>
            <td class="smallcol bold red middle changecolor">121</td>
        </tr>
        <tr class="border">
            <td class="smallcol green">3.</td>
            <td class="green tooltip">Алексис Бёф <span class="tooltiptext">Франция</span></td>
            <td class="smallcol bold green middle changecolor">110</td>
        </tr>
        <tr class="border">
            <td class="smallcol red">4.</td>
            <td class="red tooltip">Арнд Пайффер <span class="tooltiptext">Германия</span></td>
            <td class="smallcol bold red middle changecolor">105</td>
        </tr>
        <tr>
            <td class="smallcol green roundleft">5.</td>
            <td class="green tooltip">Евгений Устюгов <span class="tooltiptext">Россия</span></td>
            <td class="smallcol bold green roundright middle changecolor">104</td>
        </tr>
    </table>
</body>
</html>
