<html>
<head>
    <title>Практическая работа 2</title>
    <link href="./style/style.css"
          rel="stylesheet"
          type="text/css" />
</head>
<body>
<table>
    <tr>
        <th>Город</th>
        <th>Посещения</th>
        <th>Страниц</th>
        <th>Время</th>
    </tr>
    <tr>
        <td class="blue">СПб</td>
        <td class="blue">199</td>
        <td class="blue">18,02</td>
        <td class="time blue">00:13:45</td>
    </tr>
    <tr>
        <td class="gray">Москва</td>
        <td class="gray">69</td>
        <td rowspan="2" class="noinfo">нет данных</td>
        <td class="time gray">00:00:44</td>
    </tr>
    <tr>
        <td class="blue">Киев</td>
        <td class="blue">5</td>
        <td class="time blue">00:18:07</td>
    </tr>
    <tr>
        <td colspan="3" class="yellow">Всего посещений</td>
        <td class="orange">273</td>
    </tr>
    <caption>Посещения по городам</caption>
</table>
</body>
</html>
