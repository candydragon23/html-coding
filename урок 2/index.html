<html>
<head>
    <title>Верстка таблиц</title>
    <link href="./style/style.css"
          rel="stylesheet"
          type="text/css" />
</head>
<body>
    <table border="0">
        <caption>Успеваемость</caption>
        <tr class="black">
            <th rowspan="2">ФИО</th>
            <th colspan="2">Предмет</th>
        </tr>
        <tr class="white">
            <th>ЯРСК</th>
            <th>Программирование</th>
        </tr>
        <tr>
            <td class="gray">Петров</td>
            <td class="align gray">3</td>
            <td class="align gray">3</td>
        </tr>
        <tr>
            <td class="white">Васильева</td>
            <td class="align white">5</td>
            <td class="align white">4</td>
        </tr>
    </table>
</body>
</html>
